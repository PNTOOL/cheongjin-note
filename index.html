<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style id="base-reset">:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>청진노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b766e">
<meta name="description" content="간호학 시험공부 앱 · 간격 반복, 암기 요령, 문제풀이">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app (max 560px). Sticky top bar, fixed bottom tab bar.
   Study surfaces sit on faint chart paper (like a vital-sign sheet); mnemonics are handwritten sticky notes;
   wrong answers get a red-pen strike. */
:root{
  --bg:#edf3f2; --surface:#ffffff; --surface-2:#f4f8f8; --ink:#11252a; --muted:#53686c; --line:#d2dfdf;
  --accent:#0b766e; --accent-strong:#075c55; --accent-ink:#ffffff; --accent-soft:#d5ebe8;
  --red:#c0333f; --red-soft:#f9e2e4; --red-ink:#ffffff;
  --ok:#24784a; --ok-soft:#dcefe3; --warn:#9a6200; --warn-soft:#f6ebd2; --blue:#2c5ba3; --blue-soft:#e1e9f6;
  --memo:#fff2b0; --memo-ink:#3b3210; --memo-edge:#e7d473;
  --grid:rgba(11,118,110,.065); --shadow:0 1px 2px rgba(17,37,42,.06),0 4px 14px rgba(17,37,42,.05);
  --f-display:'Hahmlet','Noto Serif KR','AppleMyungjo',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-hand:'Gaegu','Nanum Pen Script','IBM Plex Sans KR',cursive;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --scale:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1618; --surface:#132124; --surface-2:#182a2d; --ink:#e1ecec; --muted:#93a9ab; --line:#26393c;
    --accent:#3dbcae; --accent-strong:#6fd6ca; --accent-ink:#03201c; --accent-soft:#143a36;
    --red:#ff7d86; --red-soft:#3b1c21; --red-ink:#2a0b0f;
    --ok:#6bd394; --ok-soft:#163323; --warn:#f0b54c; --warn-soft:#382c13; --blue:#94b6ff; --blue-soft:#1b2a45;
    --memo:#39331a; --memo-ink:#f3e6a4; --memo-edge:#574f24;
    --grid:rgba(61,188,174,.07); --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1618; --surface:#132124; --surface-2:#182a2d; --ink:#e1ecec; --muted:#93a9ab; --line:#26393c;
  --accent:#3dbcae; --accent-strong:#6fd6ca; --accent-ink:#03201c; --accent-soft:#143a36;
  --red:#ff7d86; --red-soft:#3b1c21; --red-ink:#2a0b0f;
  --ok:#6bd394; --ok-soft:#163323; --warn:#f0b54c; --warn-soft:#382c13; --blue:#94b6ff; --blue-soft:#1b2a45;
  --memo:#39331a; --memo-ink:#f3e6a4; --memo-edge:#574f24;
  --grid:rgba(61,188,174,.07); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.62 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:25;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{max-width:560px;margin:0 auto;padding-block:0 calc(92px + env(safe-area-inset-bottom, 0px))}
body.full #app{padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bars */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.3rem;letter-spacing:-.01em;font-weight:700}
.brand span{color:var(--muted);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.75rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);white-space:nowrap}
.top.sub{display:grid;grid-template-columns:44px minmax(0,1fr) 44px}
.top.sub h2{font-size:1rem;margin:0;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}

/* type */
h1{font-family:var(--f-display);font-size:1.75rem;line-height:1.25;margin:6px 0 4px;letter-spacing:-.015em;font-weight:700;text-wrap:balance}
.h-sm{font-size:1.375rem}
.sub{color:var(--muted);margin:0 0 16px;font-size:.9375rem;max-width:62ch}
.h3{font-size:.9375rem;font-weight:700;margin:28px 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.h3 span{font-weight:400;color:var(--muted);font-size:.8125rem}
.eyebrow{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:600}
.hint{font-size:.8125rem;color:var(--muted);margin:6px 0}
.center{text-align:center}
.note{font-size:.8125rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:20px}
.empty{color:var(--muted);text-align:center;padding:28px 8px}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9375rem/1.25 var(--f-body);padding:11px 16px;border-radius:12px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.big{width:100%;min-height:54px;font-size:1.0625rem;margin-top:16px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-strong)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row-btns .btn{flex:1 1 140px}
.chip-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 .8125rem var(--f-body);cursor:pointer;min-height:38px}
.chip-btn:hover{border-color:var(--accent)}
.chip-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}

/* chips (wristband colors) */
.chip{display:inline-flex;align-items:center;font-size:.6875rem;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:6px;white-space:nowrap;border:1px solid transparent;line-height:1.4}
.st-new{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.st-learned{background:var(--blue-soft);color:var(--blue)}
.st-known{background:var(--accent-soft);color:var(--accent-strong)}
.st-master{background:var(--ok-soft);color:var(--ok)}
.c-flag{background:var(--warn-soft);color:var(--warn)}
.c-imp{background:var(--red-soft);color:var(--red)}
.c-edit{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.c-case{background:var(--blue-soft);color:var(--blue);align-self:flex-start}
.c-src{background:var(--warn-soft);color:var(--warn);align-self:flex-start}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:13px 16px;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;min-height:58px}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--surface-2)}
.lrow b{display:block;font-weight:600}
.lrow .meta{display:block;color:var(--muted);font-size:.8125rem}
.lrow:disabled{opacity:.5;cursor:default;background:none}
.lrow svg{flex:none;color:var(--muted)}
.lrow.hl{background:var(--accent-soft)}

/* home */
.stack{display:grid;gap:14px}
.start{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;text-align:left;border:0;border-radius:22px;padding:22px 20px 26px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:var(--shadow)}
.start:hover{background:var(--accent-strong)}
.start-k{font-family:var(--f-display);font-size:1.65rem;font-weight:700;line-height:1.2}
.start-m{font-size:.875rem;opacity:.92}
.start .ecg{position:absolute;right:-6px;bottom:4px;width:64%;height:58px;opacity:.3;pointer-events:none}
.start.idle{background:var(--surface);color:var(--ink);border:1px solid var(--line);cursor:default}
.start.idle:hover{background:var(--surface)}
.start.idle .start-k{color:var(--ok)}
.promise{font-size:.8125rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.progress-strip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.progress-strip .lab{display:flex;justify-content:space-between;gap:8px;font-size:.8125rem;color:var(--muted)}
.progress-strip .lab b{color:var(--ink);font-weight:600}
.meter{display:block;height:8px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:99px}
.meter i.m2{background:var(--accent)}
.notice{border-radius:14px;padding:14px 16px;background:var(--warn-soft);border:1px solid transparent}
.notice b{color:var(--warn)}
.notice p{margin:4px 0 0;font-size:.875rem}
.notice.good{background:var(--ok-soft)} .notice.good b{color:var(--ok)}

/* onboarding */
.onboard{padding-top:32px}
.ob-brand b{display:block;font-family:var(--f-display);font-size:2.5rem;line-height:1.1;letter-spacing:-.02em}
.ob-brand span{color:var(--muted);font-size:.9375rem}
.lead{font-size:1.0625rem;margin:18px 0 8px;max-width:58ch}
.step-h{display:flex;gap:10px;align-items:center;font-size:1.05rem;margin:28px 0 12px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.8125rem;font-family:var(--f-mono)}
.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.course{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.course b{font-family:var(--f-display);font-size:1.15rem}
.course span{font-size:.8125rem;color:var(--muted)}
.course .mono{font-size:.75rem}
.course.on{border-color:var(--accent);background:var(--accent-soft)}
.course.on b{color:var(--accent-strong)}
@media (max-width:360px){.courses{grid-template-columns:1fr}}

/* forms */
input:not([type=file]),textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=file]{font-size:.875rem;max-width:100%}
textarea{resize:vertical;line-height:1.5}
.lbl{display:block;font-weight:600;font-size:.875rem;margin:16px 0 6px}
.lbl span{font-weight:400;color:var(--muted);font-size:.75rem;margin-left:4px}
.field-row{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:10px;align-items:center;margin-bottom:8px}
.field-row label{font-weight:600;font-size:.875rem}
.confirm{background:var(--red-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.confirm p{margin:0}

/* segmented */
.seg,.lvseg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin:0 0 14px;overflow-x:auto}
.seg button,.lvseg button{flex:1 0 auto;border:0;background:none;padding:8px 10px;border-radius:9px;font:600 .8125rem var(--f-body);color:var(--muted);cursor:pointer;min-height:38px;white-space:nowrap}
.seg button[aria-pressed="true"],.lvseg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* units & concept list */
.units{display:grid;gap:10px}
.unit{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer}
.unit:hover{border-color:var(--accent)}
.unit-n{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.unit-b{flex:1;min-width:0;display:grid;gap:4px}
.unit-b b{font-weight:600}
.unit-m{font-size:.8125rem;color:var(--muted)}
.clist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.crow{display:flex;align-items:center;gap:8px 10px;width:100%;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;flex-wrap:wrap;min-height:52px}
.clist li:first-child .crow{border-top:0}
.crow:hover{background:var(--surface-2)}
.cn{color:var(--muted);font-size:.8125rem;width:2.8em;flex:none}
.ct{flex:1 1 10em;min-width:0;font-weight:500}
.imp{color:var(--red);font-weight:700;font-size:.75rem;margin-left:4px}

/* concept card */
.paper{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
.concept{border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;box-shadow:var(--shadow)}
.c-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin-bottom:14px}
.c-eyebrow{grid-column:1/-1;font-size:.75rem;color:var(--muted)}
.c-title{grid-column:1;font-family:var(--f-display);font-size:1.45rem;line-height:1.3;margin:0;font-weight:700;text-wrap:balance}
.c-chips{grid-column:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.c-tools{grid-column:2;grid-row:2 / span 2;display:flex;gap:0;align-self:start}
.tool{width:40px;height:40px;border-radius:10px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.tool:hover{background:var(--surface-2);color:var(--ink)}
.tool.on{color:var(--warn);background:var(--warn-soft)}
.c-body[data-act]{cursor:pointer}
.ex p{margin:0 0 10px;max-width:65ch}
.sum{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.sum li{position:relative;padding-left:18px;font-weight:500;line-height:1.5}
.sum li::before{content:"";position:absolute;left:2px;top:.72em;width:8px;height:2px;background:var(--accent);border-radius:2px}
.why{margin:4px 0 12px;border-left:3px solid var(--accent);padding:0 0 0 12px}
.why summary{cursor:pointer;font-weight:600;color:var(--accent-strong);min-height:36px;display:flex;align-items:center;list-style:none}
.why summary::-webkit-details-marker{display:none}
.why summary::after{content:"+";margin-left:8px;font-family:var(--f-mono)}
.why[open] summary::after{content:"−"}
.why p{margin:0 0 8px}
.c-note{font-size:.8125rem;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px;margin:10px 0 0}
.taphint{font-size:.75rem;color:var(--muted);margin:12px 0 0;text-align:right}
.recall{width:100%;min-height:160px;border:2px dashed var(--line);border-radius:14px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:16px;text-align:center}
.recall span{font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.recall em{font-style:normal;color:var(--muted);font-size:.875rem}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pn .btn{font-size:.8125rem;min-width:0;justify-content:flex-start}
.pn .btn:last-child{justify-content:flex-end;text-align:right}
.pn .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sticky-note mnemonics */
.memos{display:grid;gap:10px;margin:14px 0 4px}
.memo{background:var(--memo);color:var(--memo-ink);border-radius:3px 3px 16px 3px;padding:10px 14px 12px;box-shadow:0 1px 0 var(--memo-edge),0 3px 8px rgba(0,0,0,.07);transform:rotate(-.5deg)}
.memo:nth-child(even){transform:rotate(.4deg)}
.memo-k{display:block;font-family:var(--f-body);font-size:.6875rem;font-weight:700;letter-spacing:.04em;opacity:.78;margin-bottom:2px}
.memo-s{display:block;font-family:var(--f-hand);font-size:1.25rem;line-height:1.35}
.memo.mine{background:var(--accent-soft);color:var(--accent-strong);box-shadow:0 1px 0 var(--accent),0 3px 8px rgba(0,0,0,.06)}
.memos.big .memo-s{font-size:1.5rem}
@media (prefers-reduced-motion:reduce){.memo,.memo:nth-child(even){transform:none}}

/* session & quiz */
.ses-top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:15;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ses-n{font-size:.8125rem;color:var(--muted);white-space:nowrap}
.timer{font-size:.8125rem;color:var(--warn);white-space:nowrap}
.ses-tag{font-size:.75rem;font-weight:700;letter-spacing:.05em;color:var(--accent-strong);margin:6px 0 10px}
.flash{border:1px solid var(--line);border-radius:20px;padding:20px;min-height:280px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.flash-meta{font-size:.75rem;color:var(--muted)}
.flash-front{font-family:var(--f-display);font-size:1.4rem;line-height:1.42;font-weight:600;text-wrap:balance}
.flash-back{font-size:1.15rem;font-weight:600;color:var(--accent-strong);border-top:1px dashed var(--line);padding-top:14px;line-height:1.5}
.think{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:auto}
.think i{display:block;height:100%;width:0;background:var(--accent);animation:think 3s linear forwards}
@keyframes think{to{width:100%}}
@media (prefers-reduced-motion:reduce){.think i{animation:none;width:100%}}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.g{min-height:60px;border-radius:14px;border:1px solid transparent;font:700 1rem var(--f-body);cursor:pointer}
.g0{color:var(--red);background:var(--red-soft)}
.g1{color:var(--warn);background:var(--warn-soft)}
.g2{color:var(--accent-ink);background:var(--accent)}
.g small{display:block;font:500 .6875rem var(--f-body);opacity:.8}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.qtext{font-size:1.0625rem;font-weight:600;margin:0;line-height:1.58}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;min-height:50px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .on{flex:none;font-weight:700;color:var(--muted)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .on{color:var(--ok)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong span:last-child{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.opt:disabled{cursor:default}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}

.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}

/* progress */
.ringwrap{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;flex-wrap:wrap}

.ubar{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,140px) 3.2em;gap:10px;align-items:center;padding:8px 0;font-size:.875rem}

/* memorize tools */

.pb{text-align:left;border:0;background:var(--accent-soft);color:var(--accent-strong);border-radius:10px;padding:8px 10px;font-weight:600;cursor:pointer;min-height:42px}

pre.fmt{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font:500 .8125rem/1.55 var(--f-mono);overflow-x:auto;white-space:pre}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}

.brand b{white-space:nowrap}

<script src="subjects/health-assessment.js" charset="utf-8"></script>
<script>
(function(){
'use strict';

/* ───────── 데이터 준비 ───────── */
const SUBJ = (window.NSA_SUBJECTS || [])[0];
const appEl = document.getElementById('app');
if (!SUBJ) {
  appEl.innerHTML = '<p class="empty">학습 내용 파일(subjects/health-assessment.js)을 불러오지 못했어요. index.html 옆에 subjects 폴더가 있는지 확인해 주세요.</p>';
  return;
}
const KEY = 'cheongjin-note.v1';
const DAY = 864e5, HOUR = 36e5, MIN = 6e4;
const COURSES = {
  21: { label: '21일 완성', who: '미리 준비, 여유 있게', ses: '하루 1~2회', same: [3], gap: [1, 3, 7, 14, 30] },
  14: { label: '14일 완성', who: '기본 추천', ses: '하루 2회', same: [3], gap: [1, 3, 7, 14] },
  7:  { label: '7일 완성', who: '시험이 다가옴', ses: '하루 3회', same: [3], gap: [1, 2, 4, 7] },
  3:  { label: '3일 완성', who: '급함, 벼락치기', ses: '하루 4~5회', same: [2, 5], gap: [1, 2] }
};
const CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧'];
const WD = ['일','월','화','수','목','금','토'];
const ST_LABEL = { new: '새 개념', learned: '배움', known: '외움', master: '마스터' };
const LV_LABEL = ['설명', '요약', '암기', '떠올리기'];

const UNITS = SUBJ.units;
const CONCEPTS = [], CMAP = {}, UMAP = {};
UNITS.forEach((u, ui) => {
  u.n = ui + 1; UMAP[u.id] = u;
  u.concepts.forEach((c, ci) => { c.u = u.id; c.n = ci + 1; CONCEPTS.push(c); CMAP[c.id] = c; });
});
const BASEQ = [], QMAP = {};
CONCEPTS.forEach(c => (c.ox || []).forEach((o, i) => {
  const q = { id: c.id + '-ox' + (i + 1), type: 'ox', q: o[0], o: ['O', 'X'], a: o[1] ? 0 : 1, e: o[2], c: c.id, u: c.u };
  BASEQ.push(q); QMAP[q.id] = q;
}));
UNITS.forEach(u => (u.qs || []).forEach(q => {
  const x = Object.assign({ type: 'mc', u: u.id }, q); BASEQ.push(x); QMAP[x.id] = x;
}));

/* ───────── 저장 ───────── */
function fresh(){
  return { v: 1, course: null, plan: { time: '', place: '' }, c: {}, q: {}, edits: {}, mine: {}, flags: {}, custom: [],
    log: {}, exams: [], ill: {}, tbl: {}, ord: {}, set: { scale: 1, theme: '' }, created: Date.now(), lastBackup: 0 };
}
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) return Object.assign(fresh(), o); } } catch (e) {}
  return fresh();
}
let S = load();
let canSave = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); canSave = true; } catch (e) { canSave = false; } }

/* ───────── 유틸 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const sod = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dkey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const paras = t => String(t || '').split('\n').filter(Boolean).map(p => '<p>' + esc(p) + '</p>').join('');
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function logInc(k, n){ const d = dkey(Date.now()); const L = S.log[d] || (S.log[d] = { min: 0, ses: 0, cards: 0, qs: 0, newC: 0 }); L[k] = (L[k] || 0) + (n == null ? 1 : n); }

const ICON = {
  back: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  speak: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  edit: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>',
  flag: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>',
  settings: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>'
};
const ECG = '<svg class="ecg" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" points="0,27 46,27 54,27 60,20 66,27 80,27 86,5 93,37 99,27 114,27 123,21 132,27 200,27"/></svg>';

/* ───────── 콘텐츠 접근 (수정 반영) ───────── */
function C(id){
  const b = CMAP[id]; if (!b) return null;
  const e = S.edits[id] || {};
  return Object.assign({}, b, { ex: e.ex != null ? e.ex : b.ex, sum: e.sum || b.sum, mn: e.mn || b.mn, edited: !!S.edits[id] });
}
function mnList(c){
  const out = [];
  if (S.mine[c.id]) out.push({ k: '내 암기법', s: S.mine[c.id], mine: true });
  return out.concat(c.mn || []);
}
function customQs(){
  return (S.custom || []).map(q => { const x = Object.assign({ type: 'mc', src: 'custom' }, q); QMAP[x.id] = x; return x; });
}
function allQs(){ return BASEQ.concat(customQs()); }

/* ───────── 코스 · 간격 반복 ───────── */
function co(){ return COURSES[S.course ? S.course.days : 14]; }
function courseLen(){ return S.course ? S.course.days + (S.course.ext || 0) : 14; }
function sched(){ const k = co(); return k.same.map(h => ({ h })).concat(k.gap.map(d => ({ d }))); }
function knownStep(){ return co().same.length + 1; }
function masterStep(){ return co().same.length + (S.course && S.course.days === 3 ? 1 : 2); }
function isLearned(id){ const s = S.c[id]; return !!(s && s.learned); }
function status(id){
  const s = S.c[id];
  if (!s || !s.learned) return 'new';
  if (s.step >= masterStep()) return 'master';
  if (s.step >= knownStep()) return 'known';
  return 'learned';
}
function nextDue(step, now){
  const sc = sched();
  if (step >= sc.length) return sod(now) + 45 * DAY;
  const e = sc[step];
  return e.h ? now + e.h * HOUR : sod(now) + e.d * DAY;
}
function learnConcept(id){
  const now = Date.now();
  const s = S.c[id] || { seen: 0, ok: 0, ng: 0 };
  if (!s.learned) { s.learned = now; s.step = 0; s.due = nextDue(0, now); logInc('newC'); }
  S.c[id] = s;
}
function grade(id, g){
  const now = Date.now(); const s = S.c[id]; if (!s || !s.learned) return;
  s.seen = (s.seen || 0) + 1; s.last = now;
  if (g === 2) { s.ok = (s.ok || 0) + 1; s.step = (s.step || 0) + 1; s.due = nextDue(s.step, now); s.lv0 = false; }
  else if (g === 1) { const sc = sched(); const e = sc[Math.min(s.step || 0, sc.length - 1)]; s.due = e.h ? now + e.h * HOUR : sod(now) + DAY; }
  else { s.ng = (s.ng || 0) + 1; s.step = 0; s.due = now + 10 * MIN; s.lv0 = true; }
  logInc('cards');
}
function recordQ(q, ok){
  const now = Date.now();
  const r = S.q[q.id] || (S.q[q.id] = { r: 0, w: 0, streak: 0 });
  r.last = now;
  if (ok) { r.r++; r.streak++; if (r.wrong && r.streak >= 2) r.wrong = false; }
  else {
    r.w++; r.streak = 0; r.wrong = true;
    const s = q.c && S.c[q.c];
    if (s && s.learned) {
      if (s.step >= knownStep()) S.ill[q.c] = now;
      s.lv0 = true; s.step = Math.max(0, (s.step || 0) - 1); s.due = Math.min(s.due, sod(now) + DAY);
    }
  }
  logInc('qs');
}
function dayIndex(now){ if (!S.course) return 0; return Math.floor((sod(now || Date.now()) - sod(S.course.start)) / DAY) + 1; }
function learnDays(){ const L = courseLen(); return L >= 7 ? L - 1 : L; }
function learnedCount(before){ return CONCEPTS.filter(c => { const s = S.c[c.id]; return s && s.learned && (before == null || s.learned < before); }).length; }
function todayPlan(now){
  now = now || Date.now();
  if (!S.course) return null;
  const T = CONCEPTS.length, day = dayIndex(now), L = courseLen(), ld = learnDays();
  const before = learnedCount(sod(now)), remainStart = T - before;
  const base = Math.ceil(T / ld);
  const cap = Math.ceil(base * 1.5);
  const daysLeft = Math.max(1, ld - day + 1);
  let need = day > ld ? remainStart : Math.ceil(remainStart / daysLeft);
  const behind = day <= ld && need > cap;
  let quota = day > ld ? Math.min(remainStart, base) : Math.min(need, cap);
  const doneToday = learnedCount() - before;
  return { day, L, ld, base, quota, doneToday, newLeft: Math.max(0, quota - doneToday), behind,
    reviewDay: L >= 7 && day === L && remainStart === 0, over: day > L, remain: T - learnedCount() };
}
function dueList(now){ now = now || Date.now(); return CONCEPTS.filter(c => { const s = S.c[c.id]; return s && s.learned && s.due <= now; }).sort((a, b) => S.c[a.id].due - S.c[b.id].due); }
function pendingSame(now){ now = now || Date.now(); const n = co().same.length; return CONCEPTS.filter(c => { const s = S.c[c.id]; return s && s.learned && s.step < n && s.due > now; }).sort((a, b) => S.c[a.id].due - S.c[b.id].due); }
function wrongQs(){ return allQs().filter(q => S.q[q.id] && S.q[q.id].wrong).sort((a, b) => (S.q[a.id].last || 0) - (S.q[b.id].last || 0)); }
function nextNew(n){ return CONCEPTS.filter(c => !isLearned(c.id)).slice(0, Math.max(0, n)); }
function weakTop(n){
  const m = {};
  allQs().forEach(q => { if (!q.c) return; const x = S.q[q.id]; if (!x) return; (m[q.c] = m[q.c] || [0, 0]); m[q.c][0] += x.r; m[q.c][1] += x.w; });
  return Object.keys(m).filter(k => m[k][1] > 0).map(k => ({ id: k, acc: m[k][0] / (m[k][0] + m[k][1]) })).sort((a, b) => a.acc - b.acc).slice(0, n);
}
function mixedQs(n, exclude, extraLearned){
  const learned = new Set(CONCEPTS.filter(c => isLearned(c.id)).map(c => c.id).concat(extraLearned || []));
  const pool = allQs().filter(q => q.type === 'mc' && !exclude.has(q.id) && (q.c ? learned.has(q.c) : false));
  const score = q => { const r = S.q[q.id]; if (!r) return 0; if (r.wrong) return 1; return 2 + (r.streak || 0); };
  const sorted = shuffle(pool).sort((a, b) => score(a) - score(b));
  const pick = [], usedU = new Set();
  for (const q of sorted) { if (pick.length >= n) break; if (usedU.has(q.u)) continue; pick.push(q); usedU.add(q.u); }
  for (const q of sorted) { if (pick.length >= n) break; if (!pick.includes(q)) pick.push(q); }
  return pick;
}
function viewLevel(id){
  if (R.lv[id] != null) return R.lv[id];
  if (R.viewMode !== 'auto') return +R.viewMode;
  const s = S.c[id];
  if (!s || !s.learned || s.lv0) return 0;
  return status(id) === 'master' ? 2 : 1;
}

}

/* ───────── 공부 세션 ───────── */
function oxOf(cid){ return BASEQ.find(q => q.type === 'ox' && q.c === cid); }
function buildSession(kind, arg){
  const now = Date.now(), steps = [];
  if (kind === 'review') { dueList(now).slice(0, 30).forEach(c => steps.push({ t: 'card', cid: c.id })); }
  else if (kind === 'practice') {
    const u = UMAP[arg]; let cs = u.concepts.filter(c => isLearned(c.id)); if (!cs.length) cs = u.concepts;
    shuffle(cs).slice(0, 15).forEach(c => steps.push({ t: 'card', cid: c.id, fresh: true, practice: true }));
  }
  else if (kind === 'weak') {
    weakTop(4).forEach(w => {
      steps.push({ t: 'learn', cid: w.id, relearn: true });
      allQs().filter(q => q.c === w.id).slice(0, 3).forEach(q => steps.push({ t: 'q', qid: q.id, tag: '약점 문제' }));
      steps.push({ t: 'card', cid: w.id, fresh: true });
    });
  }
  else {
    const p = todayPlan(now);
    const cap = kind === 'quick' ? 5 : 15;
    let rev = dueList(now).slice(0, cap);
    if (kind === 'quick' && rev.length < 5) rev = rev.concat(shuffle(CONCEPTS.filter(c => isLearned(c.id) && !rev.includes(c))).slice(0, 5 - rev.length));
    rev.forEach(c => steps.push({ t: 'card', cid: c.id, practice: kind === 'quick' && S.c[c.id].due > now }));
    if (kind !== 'quick') wrongQs().slice(0, 3).forEach(q => steps.push({ t: 'q', qid: q.id, tag: '오답 재도전' }));
    let news = [];
    if (kind === 'main') news = nextNew(Math.min(7, p ? p.newLeft : 5));
    else if (kind === 'extra') news = nextNew(rev.length >= 8 ? 0 : 5);
    news.forEach(c => { steps.push({ t: 'learn', cid: c.id }); const ox = oxOf(c.id); if (ox) steps.push({ t: 'q', qid: ox.id, tag: '바로 확인' }); });
    shuffle(news).forEach(c => steps.push({ t: 'card', cid: c.id, fresh: true }));
    const used = new Set(steps.filter(s => s.qid).map(s => s.qid));
    mixedQs(kind === 'quick' ? 2 : kind === 'extra' ? 5 : 3, used, news.map(c => c.id)).forEach(q => steps.push({ t: 'q', qid: q.id, tag: '섞어 풀기' }));
  }
  steps.push({ t: 'done' });
  return steps;
}
function startSession(kind, arg){
  const steps = buildSession(kind, arg);
  if (steps.length <= 1) { toast(kind === 'review' ? '지금 복습할 카드가 없어요' : '지금 할 항목이 없어요'); return; }
  R.ses = { kind, steps, i: 0, start: Date.now(), st: { rev: 0, newc: 0, qok: 0, qn: 0, again: 0 }, rq: {}, rev: false, q: null };
  logInc('ses'); save();
  R.stack = R.stack.filter(x => x.name !== 'session');
  go('session');
}
function endSession(){
  const s = R.ses; if (!s) return;
  if (!s.ended) { const m = Math.round((Date.now() - s.start) / MIN); if (m > 0) logInc('min', Math.min(m, 90)); s.ended = true; s.mins = Math.max(1, m); save(); }
  R.ses = null;
}
function nextStep(){ const s = R.ses; s.i++; s.rev = false; s.q = null; render(true); }
function pickCard(c, st){ const n = c.cards.length; const s = S.c[c.id]; const k = ((s && s.seen) || 0) + (st.again ? 1 : 0); return c.cards[k % n]; }
function vSession(){
  const s = R.ses; if (!s) return vHome();
  const st = s.steps[s.i]; const n = s.steps.length - 1;
  const done = st.t === 'done';
  let body;
  if (st.t === 'card') body = vCardStep(st);
  else if (st.t === 'learn') body = '<div class="ses-tag">' + (st.relearn ? '약점 개념 · 설명부터 다시' : '새 개념 · 읽고 이해하기') + '</div>' + conceptHTML(C(st.cid), 0, { inSession: true }) + '<button class="btn primary big" data-act="learned">이해했어요 · 다음</button>';
  else if (st.t === 'q') { const q = QMAP[st.qid]; body = '<div class="ses-tag">' + esc(st.tag || '문제') + '</div>' + qHTML(q, s.q || {}, 'sq') + (s.q && s.q.shown ? '<button class="btn primary big" data-act="snext">다음</button>' : ''); }
  else body = vDone();
  return '<div><header class="ses-top"><button class="icon-btn" data-act="exit" aria-label="그만하기">' + ICON.close + '</button><div class="pbar" role="progressbar" aria-valuenow="' + pct(s.i, n) + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct(s.i, n) + '%"></i></div><span class="mono ses-n">' + (done ? n : s.i + 1) + '/' + n + '</span></header>' + body + '</div>';
}
function vCardStep(st){
  const c = C(st.cid), s = R.ses, card = pickCard(c, st), u = UMAP[c.u];
  const tag = st.practice ? '연습 · 떠올리기' : st.again ? '다시 한 번' : st.fresh ? '방금 배운 것 · 바로 다시 떠올리기' : '복습 · 떠올리기';

function startQuiz(mode, arg){
  const all = allQs(); let ids = [], title = '', instant = true, limit = 0;
  if (mode === 'unit') {
    const pool = all.filter(q => q.u === arg);
    const ox = shuffle(pool.filter(q => q.type === 'ox')).slice(0, 5), mc = shuffle(pool.filter(q => q.type === 'mc' && !q.case)).slice(0, 6), cs = shuffle(pool.filter(q => q.case)).slice(0, 3);
    ids = ox.concat(mc, cs).map(q => q.id); title = UMAP[arg].n + '단원 테스트';
  } else if (mode === 'mock') {
    const pool = shuffle(all.filter(q => q.type === 'mc')); const n = arg === 'all' ? pool.length : Math.min(+arg, pool.length);
    ids = pool.slice(0, n).map(q => q.id); instant = false; limit = n * MIN; title = '실전 모의고사 ' + n + '문제';
  } else if (mode === 'wrong') { ids = wrongQs().map(q => q.id); title = '오답 재시험'; }
  else if (mode === 'case') { ids = shuffle(all.filter(q => q.case)).map(q => q.id); title = '사례형 집중'; }
  else if (mode === 'custom') { ids = shuffle(customQs()).map(q => q.id); title = '내가 넣은 문제'; }
  if (!ids.length) { toast('풀 문제가 없어요'); return; }
  R.quiz = { mode, ids, i: 0, ans: {}, instant, limit, start: Date.now(), title, done: false };
  R.stack = R.stack.filter(x => x.name !== 'quiz');
  go('quiz');
}

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
function say(t){
  return new Promise(res => {
    try {
      if (!('speechSynthesis' in window)) return res();
      const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = 0.95;
      let done = false; const fin = () => { if (!done) { done = true; res(); } };
      u.onend = fin; u.onerror = fin; speechSynthesis.speak(u); setTimeout(fin, 12000 + t.length * 120);
    } catch (e) { res(); }
  });
}
function stopListen(){ const L = R.t.listen; if (L) { L.token = null; L.playing = false; L.now = null; } try { speechSynthesis.cancel(); } catch (e) {} }
async function runListen(){
  const L = R.t.listen; const token = L.token = Math.random();
  const list = L.u === 'learned' ? CONCEPTS.filter(c => isLearned(c.id)) : UMAP[L.u].concepts;
  if (!list.length) { toast('먼저 개념을 배워야 들을 수 있어요'); return; }
  L.playing = true; render();
  for (const c0 of list) {
    const c = C(c0.id);
    for (const card of c.cards) {
      if (L.token !== token) return;
      L.now = { c: c.t, f: card[0], b: '' }; if (cur() && cur().name === 'listen') render();
      await say(card[0]); if (L.token !== token) return;
      await wait(3000); if (L.token !== token) return;
      L.now.b = card[1]; if (cur() && cur().name === 'listen') render();
      await say(card[1]); await wait(1200);
    }
  }
  if (L.token === token) { L.playing = false; L.now = null; if (cur() && cur().name === 'listen') render(); }
}

/* ───────── 붙여넣기 변환 ───────── */
function parsePaste(txt){
  const blocks = txt.replace(/\r/g, '').split(/\n\s*-{3,}\s*(?:\n|$)/); const out = [], errs = [];
  blocks.forEach((b, bi) => {
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean); if (!lines.length) return;
    let q = '', o = [], a = null, e = '', u = '', s = '', last = '';
    lines.forEach(l => {
      let m;
      if ((m = l.match(/^(?:Q|문제)\s*[:：.)]\s*(.*)$/i))) { q = m[1]; last = 'q'; }
      else if ((m = l.match(/^(?:A|정답|답)\s*[:：.)]\s*(.*)$/i))) { a = m[1]; last = 'a'; }
      else if ((m = l.match(/^(?:E|해설)\s*[:：.)]\s*(.*)$/i))) { e = m[1]; last = 'e'; }
      else if ((m = l.match(/^(?:U|단원)\s*[:：.)]\s*(.*)$/i))) { u = m[1]; last = 'u'; }
      else if ((m = l.match(/^(?:S|출처)\s*[:：.)]\s*(.*)$/i))) { s = m[1]; last = 's'; }
      else if ((m = l.match(/^(?:\(?([1-9])\s*[).]|([①-⑨]))\s*(.*)$/))) { o.push(m[3]); last = 'o'; }
      else if (last === 'q' || (!last && !q)) { q = q ? q + ' ' + l : l; last = 'q'; }
      else if (last === 'e') e += ' ' + l;
      else if (last === 'o' && o.length) o[o.length - 1] += ' ' + l;
    });
    let ai = null;
    if (a != null) {
      const t = String(a).trim(); const ci = '①②③④⑤⑥⑦⑧⑨'.indexOf(t[0]);
      if (ci >= 0) ai = ci; else if (/^\d/.test(t)) ai = parseInt(t, 10) - 1; else { const k = o.findIndex(x => x === t); if (k >= 0) ai = k; }
    }
    if (!q || o.length < 2 || ai == null || ai < 0 || ai >= o.length) { errs.push(bi + 1); return; }
    let uid = '';
    if (u) { const nn = parseInt(u, 10); if (nn && UNITS[nn - 1]) uid = UNITS[nn - 1].id; else { const f = UNITS.find(x => x.title.indexOf(u) >= 0); if (f) uid = f.id; } }
    out.push({ id: 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), q, o, a: ai, e, u: uid, s });
  });
  return { out, errs };
}

    const mn = $('#ed-mn').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf('|'); return i >= 0 ? { k: l.slice(0, i).trim(), s: l.slice(i + 1).trim() } : { k: '', s: l }; });
    const sum = $('#ed-sum').value.split('\n').map(l => l.trim()).filter(Boolean);
    const ex = $('#ed-ex').value.trim();
    if (mine) S.mine[a] = mine; else delete S.mine[a];
    const same = JSON.stringify(mn) === JSON.stringify(b.mn) && JSON.stringify(sum) === JSON.stringify(b.sum) && ex === b.ex;
    const prev = JSON.stringify(S.edits[a] || null);
    if (same) delete S.edits[a]; else S.edits[a] = { ex, sum: sum.length ? sum : b.sum, mn: mn.length ? mn : b.mn };
    if (JSON.stringify(S.edits[a] || null) !== prev && isLearned(a)) { const s = S.c[a]; s.step = 0; s.due = nextDue(0, Date.now()); s.lv0 = true; }
    save(); back(); toast('저장했어요');
  },
  resetEdit: a => { if (R.t.confirm !== 'reset-' + a) { R.t.confirm = 'reset-' + a; render(); return; } delete S.edits[a]; R.t.confirm = null; save(); render(); toast('원래 내용으로 되돌렸어요'); },
  tmode: a => { R.t.tmode = a; R.t.trev = {}; render(); },
  cell: a => { (R.t.trev || (R.t.trev = {}))[a] = true; render(); },
  cellmark: a => { const p = a.split('|'), id = p[0], k = p[1]; const set = new Set(S.tbl[id] || []); if (set.has(k)) set.delete(k); else set.add(k); S.tbl[id] = Array.from(set); save(); render(); },
  tclear: a => { S.tbl[a] = []; save(); render(); },
  opick: a => {
    const g = R.t.og, i = +a; const o = SUBJ.orders.find(x => x.id === g.id);
    if (i === g.done.length) { g.done.push(i); g.bad = null; if (g.done.length === o.items.length) { S.ord[o.id] = { miss: g.miss, ts: Date.now() }; save(); } }
    else { g.miss++; g.bad = i; }
    render();
  },
  oreset: () => { R.t.og = null; render(); },
  pairall: a => { R.t.pairHide = a === 'hide'; R.t.prev = {}; render(); },
  pairrev: a => { const r = R.t.prev || (R.t.prev = {}); r[a] = !r[a]; render(); },
  numall: a => { R.t.numHide = a === 'hide'; R.t.nrev = {}; render(); },
  numrev: a => { const r = R.t.nrev || (R.t.nrev = {}); r[a] = !r[a]; render(); },
  lsel: a => { stopListen(); R.t.listen = { u: a }; render(); },
  lplay: () => { try { speechSynthesis.cancel(); } catch (e) {} runListen(); },
  lstop: () => { stopListen(); render(); },
  csave: () => {
    const q = $('#cq-q').value.trim(); const o = [0, 1, 2, 3, 4].map(i => $('#cq-o' + i).value.trim()).filter(Boolean);
    const a = +$('#cq-a').value;
    if (!q || o.length < 2) { toast('문제와 보기를 2개 이상 써 주세요'); return; }
    if (a >= o.length) { toast('정답 번호가 보기 개수보다 커요'); return; }
    S.custom.push({ id: 'x' + Date.now().toString(36), q, o, a, e: $('#cq-e').value.trim(), u: $('#cq-u').value, s: $('#cq-s').value.trim() });
    save(); back(); toast('문제를 추가했어요');
  },
  cparse: () => {
    const txt = $('#cp-txt').value; const r = parsePaste(txt);
    r.out.forEach(q => S.custom.push(q)); save();
    R.t.pasteMsg = r.out.length + '문제를 추가했어요.' + (r.errs.length ? ' ' + r.errs.join(', ') + '번째 묶음은 형식이 맞지 않아 건너뛰었어요 (문제, 보기 2개 이상, 정답 번호가 필요해요).' : '');
    render();
  },
  cdel: a => { if (R.t.confirm !== 'del-' + a) { R.t.confirm = 'del-' + a; render(); return; } S.custom = S.custom.filter(q => q.id !== a); delete S.q[a]; R.t.confirm = null; save(); render(); },
  csel: a => { R.t.courseSel = +a; render(); },
  capply: () => { const k = R.t.courseSel || S.course.days; S.course = { days: k, start: Date.now(), ext: 0 }; save(); R.t.courseSel = null; toast(COURSES[k].label + ' 코스를 오늘부터 시작해요'); R.stack = []; R.tab = 'home'; render(true); },
  extend: () => { S.course.ext = (S.course.ext || 0) + 3; save(); render(); toast('코스를 3일 늘렸어요'); },
  saveplan: () => { S.plan.time = $('#st-time').value.trim(); S.plan.place = $('#st-place').value.trim(); save(); toast('공부 약속을 저장했어요'); },
  scale: a => { S.set.scale = +a; save(); applySettings(); render(); },
  theme: a => { S.set.theme = a; save(); applySettings(); render(); },
  wipe: () => { R.t.confirm = 'wipe'; render(); },
  wipeNo: () => { R.t.confirm = null; render(); },
  wipeYes: () => { S = fresh(); save(); R.t = {}; R.stack = []; R.tab = 'home'; applySettings(); render(true); toast('모든 기록을 지웠어요'); },
  bkfile: async () => {
    const fname = '청진노트-백업-' + dkey(Date.now()) + '.json';
    const viewer = window.claude && typeof window.claude.use === 'function';
    if (viewer) {
      let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) {}
      if (dl) {
        try { await dl.save({ filename: fname, data: JSON.stringify(S) }); S.lastBackup = Date.now(); save(); render(); toast('백업 파일을 저장했어요'); }
        catch (err) { const c = err && err.code; toast(c === 'declined' ? '저장을 취소했어요' : c === 'rate_limited' ? '잠시 뒤 다시 눌러 주세요' : '이 화면에서는 파일 저장이 안 돼요. 복사하기를 쓰세요'); }
        return;
      }
    }
    try {
      const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      S.lastBackup = Date.now(); save(); render(); toast('백업 파일을 만들었어요. 저장되지 않았다면 복사하기를 쓰세요');
    } catch (e) { toast('이 화면에서는 파일 저장이 안 돼요. 복사하기를 쓰세요'); }
  },
  bkcopy: () => {
    const ta = $('#bk-out'); const txt = ta.value;
    const done = () => { S.lastBackup = Date.now(); save(); toast('복사했어요. 메모 앱 등에 붙여넣어 보관하세요'); };
    try {
      navigator.clipboard.writeText(txt).then(done, () => { ta.focus(); ta.select(); toast('자동 복사가 안 돼요. 선택된 내용을 직접 복사하세요'); });
    } catch (e) { ta.focus(); ta.select(); toast('자동 복사가 안 돼요. 선택된 내용을 직접 복사하세요'); }
  },
  bkload: () => {
    const txt = ($('#bk-in').value || '').trim(); R.t.bkText = txt;
    try {
      const o = JSON.parse(txt); if (!o || o.v !== 1 || typeof o.c !== 'object') throw 0;
      const n = Object.keys(o.c).filter(k => o.c[k] && o.c[k].learned).length;
      R.t.bkPending = { data: o, info: '배운 개념 ' + n + '개, 내 문제 ' + ((o.custom || []).length) + '개' }; render();
    } catch (e) { toast('백업 내용을 읽을 수 없어요. 전체를 빠짐없이 붙여넣었는지 확인하세요'); }
  },
  bkapply: () => { S = Object.assign(fresh(), R.t.bkPending.data); save(); R.t = {}; R.stack = []; R.tab = 'home'; applySettings(); render(true); toast('기록을 불러왔어요'); },
  bkcancel: () => { R.t.bkPending = null; render(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) f(el.dataset.arg || '', el, e);
});
document.addEventListener('change', e => {
  if (e.target.id === 'bk-file' && e.target.files && e.target.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { R.t.bkText = String(rd.result || ''); const ta = $('#bk-in'); if (ta) ta.value = R.t.bkText; ACT.bkload(); };
    rd.readAsText(e.target.files[0]);
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  const sc = cur(); if (!sc) return;
  if (sc.name === 'session' && R.ses) {
    const st = R.ses.steps[R.ses.i];
    if (st.t === 'card') {
      if (!R.ses.rev && (e.key === ' ' || e.key === 'Enter')) { const b = $('#reveal'); if (b && !b.disabled) { e.preventDefault(); ACT.reveal(); } }
      else if (R.ses.rev && ['1', '2', '3'].includes(e.key)) ACT.grade(String(+e.key - 1));
    } else if (st.t === 'q' && !(R.ses.q && R.ses.q.shown) && /^[1-5]$/.test(e.key)) {
      const q = QMAP[st.qid]; const k = +e.key - 1; if (k < (q.type === 'ox' ? 2 : q.o.length)) ACT.pick('sq:' + k);
    } else if ((st.t === 'q' && R.ses.q && R.ses.q.shown) && e.key === 'Enter') { e.preventDefault(); nextStep(); }
  }
});

/* 설치용 (앱으로 설치할 때만) */
(function(){
  let top = true; try { top = window.self === window.top; } catch (e) { top = false; }
  if (!top || location.protocol !== 'https:') return;
  const m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.json'; document.head.appendChild(m);
  const ic = document.createElement('link'); ic.rel = 'apple-touch-icon'; ic.href = 'icon-192.png'; document.head.appendChild(ic);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

applySettings();
render();
window.__CJ = { S: () => S, R, ACT, CONCEPTS, BASEQ, todayPlan, dueList };
})();
</script>
