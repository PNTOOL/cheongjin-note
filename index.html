<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style id="base-reset">:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>청진노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b766e">
<meta name="description" content="간호학 시험공부 앱 · 간격 반복, 암기 요령, 국시형 문제, 한 장 요약지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app (max 560px). Sticky top bar, fixed bottom tab bar (4 tabs).
   Study surfaces sit on faint chart paper (like a vital-sign sheet); mnemonics are handwritten sticky notes;
   wrong answers get a red-pen strike. */
:root{
  --bg:#edf3f2; --surface:#ffffff; --surface-2:#f4f8f8; --ink:#11252a; --muted:#53686c; --line:#d2dfdf;
  --accent:#0b766e; --accent-strong:#075c55; --accent-ink:#ffffff; --accent-soft:#d5ebe8;
  --red:#c0333f; --red-soft:#f9e2e4; --red-ink:#ffffff;
  --ok:#24784a; --ok-soft:#dcefe3; --warn:#9a6200; --warn-soft:#f6ebd2; --blue:#2c5ba3; --blue-soft:#e1e9f6;
  --memo:#fff2b0; --memo-ink:#3b3210; --memo-edge:#e7d473;
  --grid:rgba(11,118,110,.065); --shadow:0 1px 2px rgba(17,37,42,.06),0 4px 14px rgba(17,37,42,.05);
  --f-display:'Hahmlet','Noto Serif KR','AppleMyungjo',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-hand:'Gaegu','Nanum Pen Script','IBM Plex Sans KR',cursive;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --scale:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1618; --surface:#132124; --surface-2:#182a2d; --ink:#e1ecec; --muted:#93a9ab; --line:#26393c;
    --accent:#3dbcae; --accent-strong:#6fd6ca; --accent-ink:#03201c; --accent-soft:#143a36;
    --red:#ff7d86; --red-soft:#3b1c21; --red-ink:#2a0b0f;
    --ok:#6bd394; --ok-soft:#163323; --warn:#f0b54c; --warn-soft:#382c13; --blue:#94b6ff; --blue-soft:#1b2a45;
    --memo:#39331a; --memo-ink:#f3e6a4; --memo-edge:#574f24;
    --grid:rgba(61,188,174,.07); --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1618; --surface:#132124; --surface-2:#182a2d; --ink:#e1ecec; --muted:#93a9ab; --line:#26393c;
  --accent:#3dbcae; --accent-strong:#6fd6ca; --accent-ink:#03201c; --accent-soft:#143a36;
  --red:#ff7d86; --red-soft:#3b1c21; --red-ink:#2a0b0f;
  --ok:#6bd394; --ok-soft:#163323; --warn:#f0b54c; --warn-soft:#382c13; --blue:#94b6ff; --blue-soft:#1b2a45;
  --memo:#39331a; --memo-ink:#f3e6a4; --memo-edge:#574f24;
  --grid:rgba(61,188,174,.07); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.62 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:25;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{max-width:560px;margin:0 auto;padding-block:0 calc(92px + env(safe-area-inset-bottom, 0px))}
body.full #app{padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bars */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.3rem;letter-spacing:-.01em;font-weight:700}
.brand span{color:var(--muted);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.75rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);white-space:nowrap}
.top.sub{display:grid;grid-template-columns:44px minmax(0,1fr) 44px}
.top.sub h2{font-size:1rem;margin:0;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}

/* type */
h1{font-family:var(--f-display);font-size:1.75rem;line-height:1.25;margin:6px 0 4px;letter-spacing:-.015em;font-weight:700;text-wrap:balance}
.h-sm{font-size:1.375rem}
.sub{color:var(--muted);margin:0 0 16px;font-size:.9375rem;max-width:62ch}
.h3{font-size:.9375rem;font-weight:700;margin:28px 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.h3 span{font-weight:400;color:var(--muted);font-size:.8125rem}
.eyebrow{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:600}
.hint{font-size:.8125rem;color:var(--muted);margin:6px 0}
.center{text-align:center}
.note{font-size:.8125rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:20px}
.empty{color:var(--muted);text-align:center;padding:28px 8px}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9375rem/1.25 var(--f-body);padding:11px 16px;border-radius:12px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.big{width:100%;min-height:54px;font-size:1.0625rem;margin-top:16px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-strong)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row-btns .btn{flex:1 1 140px}
.chip-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 .8125rem var(--f-body);cursor:pointer;min-height:38px}
.chip-btn:hover{border-color:var(--accent)}
.chip-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}

/* chips (wristband colors) */
.chip{display:inline-flex;align-items:center;font-size:.6875rem;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:6px;white-space:nowrap;border:1px solid transparent;line-height:1.4}
.st-new{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.st-learned{background:var(--blue-soft);color:var(--blue)}
.st-known{background:var(--accent-soft);color:var(--accent-strong)}
.st-master{background:var(--ok-soft);color:var(--ok)}
.c-flag{background:var(--warn-soft);color:var(--warn)}
.c-imp{background:var(--red-soft);color:var(--red)}
.c-edit{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.c-case{background:var(--blue-soft);color:var(--blue);align-self:flex-start}
.c-src{background:var(--warn-soft);color:var(--warn);align-self:flex-start}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:13px 16px;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;min-height:58px}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--surface-2)}
.lrow b{display:block;font-weight:600}
.lrow .meta{display:block;color:var(--muted);font-size:.8125rem}
.lrow:disabled{opacity:.5;cursor:default;background:none}
.lrow svg{flex:none;color:var(--muted)}
.lrow.hl{background:var(--accent-soft)}

/* home */
.stack{display:grid;gap:14px}
.start{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;text-align:left;border:0;border-radius:22px;padding:22px 20px 26px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:var(--shadow)}
.start:hover{background:var(--accent-strong)}
.start-k{font-family:var(--f-display);font-size:1.65rem;font-weight:700;line-height:1.2}
.start-m{font-size:.875rem;opacity:.92}
.start .ecg{position:absolute;right:-6px;bottom:4px;width:64%;height:58px;opacity:.3;pointer-events:none}
.start.idle{background:var(--surface);color:var(--ink);border:1px solid var(--line);cursor:default}
.start.idle:hover{background:var(--surface)}
.start.idle .start-k{color:var(--ok)}
.promise{font-size:.8125rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.progress-strip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.progress-strip .lab{display:flex;justify-content:space-between;gap:8px;font-size:.8125rem;color:var(--muted)}
.progress-strip .lab b{color:var(--ink);font-weight:600}
.meter{display:block;height:8px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:99px}
.meter i.m2{background:var(--accent)}
.notice{border-radius:14px;padding:14px 16px;background:var(--warn-soft);border:1px solid transparent}
.notice b{color:var(--warn)}
.notice p{margin:4px 0 0;font-size:.875rem}
.notice.good{background:var(--ok-soft)} .notice.good b{color:var(--ok)}

/* forms */
input:not([type=file]),textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=file]{font-size:.875rem;max-width:100%}
textarea{resize:vertical;line-height:1.5}
.lbl{display:block;font-weight:600;font-size:.875rem;margin:16px 0 6px}
.lbl span{font-weight:400;color:var(--muted);font-size:.75rem;margin-left:4px}
.field-row{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:10px;align-items:center;margin-bottom:8px}
.field-row label{font-weight:600;font-size:.875rem}
.confirm{background:var(--red-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.confirm p{margin:0}

/* segmented */
.seg,.lvseg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin:0 0 14px;overflow-x:auto}
.seg button,.lvseg button{flex:1 0 auto;border:0;background:none;padding:8px 10px;border-radius:9px;font:600 .8125rem var(--f-body);color:var(--muted);cursor:pointer;min-height:38px;white-space:nowrap}
.seg button[aria-pressed="true"],.lvseg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* units & concept list */
.units{display:grid;gap:10px}
.unit{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer}
.unit:hover{border-color:var(--accent)}
.unit-n{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.unit-b{flex:1;min-width:0;display:grid;gap:4px}
.unit-b b{font-weight:600}
.unit-m{font-size:.8125rem;color:var(--muted)}
.clist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.crow{display:flex;align-items:center;gap:8px 10px;width:100%;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;flex-wrap:wrap;min-height:52px}
.clist li:first-child .crow{border-top:0}
.crow:hover{background:var(--surface-2)}
.cn{color:var(--muted);font-size:.8125rem;width:2.8em;flex:none}
.ct{flex:1 1 10em;min-width:0;font-weight:500}
.imp{color:var(--red);font-weight:700;font-size:.75rem;margin-left:4px}

/* concept card */
.paper{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
.concept{border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;box-shadow:var(--shadow)}
.c-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin-bottom:14px}
.c-eyebrow{grid-column:1/-1;font-size:.75rem;color:var(--muted)}
.c-title{grid-column:1;font-family:var(--f-display);font-size:1.45rem;line-height:1.3;margin:0;font-weight:700;text-wrap:balance}
.c-chips{grid-column:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.c-tools{grid-column:2;grid-row:2 / span 2;display:flex;gap:0;align-self:start}
.tool{width:40px;height:40px;border-radius:10px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.tool:hover{background:var(--surface-2);color:var(--ink)}
.tool.on{color:var(--warn);background:var(--warn-soft)}
.c-body[data-act]{cursor:pointer}
.ex p{margin:0 0 10px;max-width:65ch}
.sum{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.sum li{position:relative;padding-left:18px;font-weight:500;line-height:1.5}
.sum li::before{content:"";position:absolute;left:2px;top:.72em;width:8px;height:2px;background:var(--accent);border-radius:2px}
.why{margin:4px 0 12px;border-left:3px solid var(--accent);padding:0 0 0 12px}
.why summary{cursor:pointer;font-weight:600;color:var(--accent-strong);min-height:36px;display:flex;align-items:center;list-style:none}
.why summary::-webkit-details-marker{display:none}
.why summary::after{content:"+";margin-left:8px;font-family:var(--f-mono)}
.why[open] summary::after{content:"−"}
.why p{margin:0 0 8px}
.c-note{font-size:.8125rem;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px;margin:10px 0 0}
.taphint{font-size:.75rem;color:var(--muted);margin:12px 0 0;text-align:right}
.recall{width:100%;min-height:160px;border:2px dashed var(--line);border-radius:14px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:16px;text-align:center}
.recall span{font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.recall em{font-style:normal;color:var(--muted);font-size:.875rem}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pn .btn{font-size:.8125rem;min-width:0;justify-content:flex-start}
.pn .btn:last-child{justify-content:flex-end;text-align:right}
.pn .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sticky-note mnemonics */
.memos{display:grid;gap:10px;margin:14px 0 4px}
.memo{background:var(--memo);color:var(--memo-ink);border-radius:3px 3px 16px 3px;padding:10px 14px 12px;box-shadow:0 1px 0 var(--memo-edge),0 3px 8px rgba(0,0,0,.07);transform:rotate(-.5deg)}
.memo:nth-child(even){transform:rotate(.4deg)}
.memo-k{display:block;font-family:var(--f-body);font-size:.6875rem;font-weight:700;letter-spacing:.04em;opacity:.78;margin-bottom:2px}
.memo-s{display:block;font-family:var(--f-hand);font-size:1.25rem;line-height:1.35}
.memo.mine{background:var(--accent-soft);color:var(--accent-strong);box-shadow:0 1px 0 var(--accent),0 3px 8px rgba(0,0,0,.06)}
.memos.big .memo-s{font-size:1.5rem}
@media (prefers-reduced-motion:reduce){.memo,.memo:nth-child(even){transform:none}}

/* session & quiz */
.ses-top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:15;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ses-n{font-size:.8125rem;color:var(--muted);white-space:nowrap}
.timer{font-size:.8125rem;color:var(--warn);white-space:nowrap}
.ses-tag{font-size:.75rem;font-weight:700;letter-spacing:.05em;color:var(--accent-strong);margin:6px 0 10px}
.flash{border:1px solid var(--line);border-radius:20px;padding:20px;min-height:280px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.flash-meta{font-size:.75rem;color:var(--muted)}
.flash-front{font-family:var(--f-display);font-size:1.4rem;line-height:1.42;font-weight:600;text-wrap:balance}
.flash-back{font-size:1.15rem;font-weight:600;color:var(--accent-strong);border-top:1px dashed var(--line);padding-top:14px;line-height:1.5}
.think{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:auto}
.think i{display:block;height:100%;width:0;background:var(--accent);animation:think 3s linear forwards}
@keyframes think{to{width:100%}}
@media (prefers-reduced-motion:reduce){.think i{animation:none;width:100%}}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.g{min-height:60px;border-radius:14px;border:1px solid transparent;font:700 1rem var(--f-body);cursor:pointer}
.g0{color:var(--red);background:var(--red-soft)}
.g1{color:var(--warn);background:var(--warn-soft)}
.g2{color:var(--accent-ink);background:var(--accent)}
.g small{display:block;font:500 .6875rem var(--f-body);opacity:.8}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.qtext{font-size:1.0625rem;font-weight:600;margin:0;line-height:1.58}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;min-height:50px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .on{flex:none;font-weight:700;color:var(--muted)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .on{color:var(--ok)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong span:last-child{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.opt:disabled{cursor:default}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .opt{justify-content:center;align-items:center;min-height:92px}
.ox-mark{font-size:2.3rem;font-weight:600;font-family:var(--f-mono);line-height:1}
.ox .opt.wrong span:last-child{text-decoration:none}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.ng{background:var(--red-soft);color:var(--red)}
.fb b{font-size:1rem}
.fb span{font-weight:600;font-size:.875rem}
.fb p{margin:6px 0 0;color:var(--ink)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.reasons>span{font-size:.75rem;color:var(--muted);margin-right:4px}
.rel{border-top:1px dashed var(--line);padding-top:6px}
.rel summary{cursor:pointer;font-weight:600;color:var(--accent-strong);min-height:40px;display:flex;align-items:center}
.qnav{display:flex;gap:8px;align-items:stretch}
.qnav .btn{margin-top:16px;min-height:54px}
.qnav .btn.big{flex:1}

/* memorize tools */

.seg.sm{margin:0}
.seg.sm button{min-height:36px;padding:6px 8px}
.a4wrap{margin-top:12px;display:grid;gap:12px;justify-content:center}
.a4wrap.big{overflow-x:auto;justify-content:start;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-left:-4px;margin-right:-4px}
.a4-slot{position:relative;overflow:hidden;border-radius:4px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 20px rgba(0,0,0,.08)}
.a4-sc{transform-origin:0 0;width:794px;height:1123px}
.a4{width:794px;height:1123px;padding:24px 26px 14px;background:#fff;color:#15252a;display:flex;flex-direction:column;font-family:var(--f-body);box-sizing:border-box;word-break:keep-all;overflow-wrap:anywhere}
.a4-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid #0b766e;padding-bottom:5px;margin-bottom:8px;font-size:9.5px;color:#55686c}
.a4-h b{font-family:var(--f-display);font-size:15px;color:#075c55}
.a4-b{flex:1 1 auto;min-height:0;column-count:4;column-gap:12px;column-fill:auto;column-rule:1px solid #e3eaea;overflow:hidden;font-size:8.6px;line-height:1.36}
.a4-f{text-align:center;font-size:8px;color:#7b8b8f;padding-top:5px;font-family:var(--f-mono)}
.nu,.nh{break-inside:avoid;break-after:avoid;font-weight:700;font-size:9.4px;color:#fff;background:#0b766e;padding:2px 6px;border-radius:3px;margin:0 0 4px}
.nh{background:#36505a;margin-top:2px}
.ni{break-inside:avoid;padding:2px 2px 4px;border-bottom:1px dotted #cfdada;margin-bottom:3px;cursor:pointer;border-radius:2px}
.ni-t{font-weight:700;font-size:9.2px;color:#0f2a2e}
.ni-t i{font-style:normal;color:#fff;background:#c0333f;border-radius:50%;display:inline-block;width:11px;height:11px;line-height:11px;text-align:center;font-size:8px;margin-right:3px}
.ni-m{color:#3d3207;background:#fff4bf;padding:1px 3px;border-radius:2px;margin-top:1px}
.ni-m b{color:#a3242f}
.ni-m .ni-k{color:#075c55}
.ni-1{color:#2c4045;margin-top:1px}
.ni-s{margin:1px 0 0;padding-left:9px;color:#2c4045}
.ni-s li{margin:0}
.ni-map{color:#5b6d70;font-size:7.8px;margin-top:1px}
.ni.weak{background:#ffe8eb}
.nn{display:flex;justify-content:space-between;gap:6px;break-inside:avoid;border-bottom:1px dotted #cfdada;padding:1px 0}
.nn b{font-family:var(--f-mono);font-weight:600;color:#075c55;text-align:right}
.np{break-inside:avoid;display:grid;border-bottom:1px dotted #cfdada;padding:2px 0}
.np i{font-style:normal;font-weight:700;color:#36505a}
.np span::before{content:"· "}
#measure{position:absolute;left:-30000px;top:0;visibility:hidden;pointer-events:none}
.pdf-holder{position:fixed;left:-30000px;top:0;width:794px}
.pdfbox{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:6px;flex-wrap:wrap}
.pdfbox.ready{display:grid;background:var(--accent-soft);border-color:transparent}
.pdfbox .meta{display:block;font-size:.8125rem;color:var(--muted)}
.pdfbox .row-btns{margin-top:4px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 내 그림 */
.img-add{display:grid;gap:8px;margin-top:6px}
.gq-line{display:flex;gap:8px;flex-wrap:wrap}
.gq-line input{flex:1 1 180px;min-width:0}
.gq-line .btn{flex:1 1 auto;text-decoration:none}
.gq-back{background:var(--accent-soft);border-radius:12px;padding:10px}
.gq-back .btn{width:100%}
.img-add .hint{margin:0}
label.btn{cursor:pointer}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fcard{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px;cursor:pointer;color:var(--ink)}
.fcard img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.fcard span{font-size:.8125rem;font-weight:600;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard i{font-style:normal;font-size:.75rem;color:var(--muted);padding:0 4px 4px}
.fig-stage{position:relative;line-height:0;user-select:none;-webkit-user-select:none;border-radius:12px;overflow:hidden;background:var(--surface-2);margin:8px 0}
.fig-stage img{display:block;width:100%;height:auto;-webkit-touch-callout:none;pointer-events:none}
.fig-stage.tap{touch-action:none;cursor:crosshair}
.mask{position:absolute;background:#cfd9d9;border-radius:3px;display:block}
.fig-stage.view .mask{background:rgba(120,145,146,.5);outline:1px dashed rgba(60,80,80,.7)}
.fig-stage.masking .mask{background:rgba(207,217,217,.92);outline:1px solid #8aa0a1}
.mask.tmp{background:rgba(11,118,110,.3);outline:2px dashed var(--accent)}
.dot-n{position:absolute;transform:translate(-50%,-50%);min-width:28px;height:28px;border-radius:99px;background:var(--accent);color:#fff;font:700 13px/24px var(--f-mono);text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);padding:0 4px;display:inline-block}
button.dot-n{cursor:pointer;min-width:38px;height:38px;line-height:34px;font-size:15px}
.dot-n.right{background:var(--ok)} .dot-n.wrong{background:var(--red)} .dot-n.dim{opacity:.4} .dot-n.ask{background:var(--warn);min-width:34px;height:34px;line-height:30px}
.dot-n.sm{position:static;transform:none;min-width:24px;height:24px;line-height:20px;font-size:12px;box-shadow:none}
.mk-prompt{display:flex;gap:10px;align-items:center;font-size:1.125rem;margin:8px 0}
.mk-prompt .dot-n{position:static;transform:none;flex:none}
.mk-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.875rem}
.mk-list li{display:flex;gap:6px;align-items:center}
.iv-wrap{overflow:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
.iv-wrap.zoom .fig-stage{width:230%}
.iv-btn{display:block;cursor:zoom-in}
.iv-wrap.zoom .iv-btn{cursor:zoom-out}
.cap{margin:0 0 4px;font-weight:600}
.ed-stage{display:flex;justify-content:center;align-items:center;flex-direction:column;background:var(--surface-2);border-radius:14px;padding:8px;min-height:220px;margin-top:8px}
.ed-box{position:relative;touch-action:none;line-height:0;overflow:hidden;border-radius:6px}
.ed-box canvas{display:block}
.ed-crop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);display:block}

/* 진도 */
.ulist{display:grid;gap:8px}
.urow{display:grid;gap:8px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.urow:hover{border-color:var(--accent)}
.urow-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9375rem}
.urow-h b{font-weight:600}
.urow-b{display:grid;grid-template-columns:auto minmax(0,1fr) 2.8em auto minmax(0,1fr) 2.8em;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
.urow-b b{color:var(--ink);font-weight:600;text-align:right;font-size:.8125rem}
.ub2{position:relative;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.ub2 i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:99px}
.ub2.acc i{background:var(--accent)}
.ub2 i.low{background:var(--red)}
@media (max-width:370px){.urow-b{grid-template-columns:auto minmax(0,1fr) 2.8em}}
</style>
</head>
